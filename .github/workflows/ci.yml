name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run html5validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          # summary.html embeds the vendored js-codepage library (SheetJS),
          # whose codepage tables are legitimate raw control-byte string
          # literals — not an authoring bug, so it's excluded here.
          # googleefff10fd12df70f2.html is a Google Search Console ownership
          # verification file — its required content is plain text, not HTML.
          blacklist: .agents .claude summary.html googleefff10fd12df70f2.html
          # exam.html/survey.html use calc()+env(safe-area-inset-bottom) for
          # iOS safe-area padding, which is valid modern CSS but trips the
          # bundled vnu.jar CSS checker's parser. This action passes `extra`
          # to the shell unquoted, so: (1) no literal spaces inside a single
          # pattern (use \s instead) or it splits into separate args, (2) no
          # quote characters around patterns (they'd be taken literally, not
          # stripped as shell quoting), and (3) --ignore-re must be given
          # only once — argparse overwrites on repeated flags, it doesn't
          # accumulate — with all patterns space-separated after it.
          extra: >-
            --ignore-re
            exam\.html.*"padding":\sParse\sError
            survey\.html.*"padding":\sParse\sError
            survey\.html.*padding-bottom.*env\(safe-area-inset-bottom\)

  check-links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            './**/*.html'
          fail: true
