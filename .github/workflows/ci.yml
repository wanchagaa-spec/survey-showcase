name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run html5validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: .
          # summary.html embeds the vendored js-codepage library (SheetJS),
          # whose codepage tables are legitimate raw control-byte string
          # literals — not an authoring bug, so it's excluded here.
          blacklist: .agents .claude summary.html

  check-links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            './**/*.html'
          fail: true
