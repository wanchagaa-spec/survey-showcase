<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบสอบถาม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
/* ═══════════════════════════════════════════════════════════════
   ตั้งค่าทั้งหมดอยู่ในก้อนนี้ก้อนเดียว — ลูกค้ารายใหม่แก้แค่ตรงนี้
   ไม่ต้องแตะโค้ดข้างล่างเลย
   ═══════════════════════════════════════════════════════════════ */
const CONFIG = {

  /* ── 1. หัวเรื่อง ─────────────────────────────────────────── */
  formId:   "sat-2569",                       // รหัสฟอร์ม ใช้แยกข้อมูลในชีต
  org:      "โรงพยาบาลโพนทราย",
  title:    "แบบสอบถามความพึงพอใจผู้รับบริการ",
  subtitle: "กลุ่มงานรังสีวิทยา · ใช้เวลาประมาณ 2 นาที",
  logo:     "",                               // ใส่ URL รูปโลโก้ หรือเว้นว่าง

  /* ── 2. ปลายทางข้อมูล ─────────────────────────────────────── */
  demoMode: true,                             // true = โหมดตัวอย่าง ไม่บันทึกข้อมูลจริง
  endpoint: "",                               // URL ของ Apps Script (ดู Code.gs)
  token:    "CHANGE_ME",                      // ต้องตรงกับใน Code.gs
  submitOnce: true,                           // กันตอบซ้ำจากเครื่องเดิม

  /* ── 3. หน้าขอบคุณ ────────────────────────────────────────── */
  thanks: {
    title: "ส่งเรียบร้อยแล้ว",
    body:  "ขอบคุณที่สละเวลาให้ความเห็น ทางแผนกจะนำไปปรับปรุงบริการต่อไป"
  },

  /* ── 4. ธีมสี (ไม่ใส่ = ใช้ค่าเริ่มต้น) ─────────────────────── */
  theme: {
    ink:    "#12313A",   // สีตัวอักษร/พื้นหัว
    accent: "#DFA23C",   // สีเน้น (แถบคะแนน)
    jade:   "#1E6E68",   // สีตัวเลือกที่ถูกเลือก
    paper:  "#EFF3F2"    // สีพื้นหลัง
  },

  /* ── 5. คำถาม ─────────────────────────────────────────────── */
  /*
     ชนิดคำถามที่ใช้ได้:
       scale     แถบคะแนน   → points, lowLabel, highLabel
       single    เลือกหนึ่ง  → options
       multi     เลือกหลาย  → options, max (ไม่ใส่ = ไม่จำกัด)
       dropdown  เมนูเลื่อน  → options
       text      ข้อความสั้น
       longtext  ข้อความยาว
       number    ตัวเลข      → min, max
       date      วันที่

     ทุกข้อใส่ได้:
       required: true            บังคับตอบ
       help: "คำอธิบายใต้คำถาม"
       showIf: { id:"q3", anyOf:["เคย"] }    แสดงเมื่อข้อ q3 ตอบว่า "เคย"
  */
  sections: [
    {
      title: "ข้อมูลผู้ตอบ",
      desc:  "ไม่ต้องระบุชื่อ ข้อมูลถูกเก็บแบบไม่ระบุตัวตน",
      questions: [
        { id:"age", type:"single", label:"ช่วงอายุ", required:true,
          options:["ต่ำกว่า 20 ปี","20–39 ปี","40–59 ปี","60 ปีขึ้นไป"] },

        { id:"visit", type:"single", label:"เคยมารับบริการที่แผนกนี้มาก่อนหรือไม่", required:true,
          options:["มาครั้งแรก","เคยมาแล้ว"] },

        { id:"times", type:"dropdown", label:"เคยมารับบริการมาแล้วกี่ครั้ง", required:true,
          options:["2–3 ครั้ง","4–6 ครั้ง","มากกว่า 6 ครั้ง"],
          showIf:{ id:"visit", anyOf:["เคยมาแล้ว"] } },

        { id:"service", type:"multi", label:"รับบริการด้านใดบ้าง (ตอบได้มากกว่า 1 ข้อ)", required:true,
          options:["เอกซเรย์ทั่วไป","เอกซเรย์ทันตกรรม","อัลตราซาวด์","อื่น ๆ"] }
      ]
    },
    {
      title: "ความพึงพอใจ",
      desc:  "กดเลือกระดับคะแนน 1 คือน้อยที่สุด 5 คือมากที่สุด",
      questions: [
        { id:"s_staff", type:"scale", points:5, required:true,
          label:"ความสุภาพและการให้คำแนะนำของเจ้าหน้าที่",
          lowLabel:"น้อยที่สุด", highLabel:"มากที่สุด" },

        { id:"s_time", type:"scale", points:5, required:true,
          label:"ความรวดเร็วในการให้บริการ",
          lowLabel:"น้อยที่สุด", highLabel:"มากที่สุด" },

        { id:"s_place", type:"scale", points:5, required:true,
          label:"ความสะอาดและความเหมาะสมของสถานที่",
          lowLabel:"น้อยที่สุด", highLabel:"มากที่สุด" },

        { id:"s_overall", type:"scale", points:5, required:true,
          label:"ความพึงพอใจโดยรวมต่อบริการ",
          lowLabel:"น้อยที่สุด", highLabel:"มากที่สุด" }
      ]
    },
    {
      title: "ข้อเสนอแนะ",
      questions: [
        { id:"problem", type:"longtext", required:false, maxLength:500,
          label:"พบปัญหาหรือสิ่งที่ควรปรับปรุงหรือไม่",
          help:"เขียนเท่าที่สะดวก ไม่บังคับตอบ",
          placeholder:"เช่น รอคิวนาน ป้ายบอกทางไม่ชัดเจน" },

        { id:"recommend", type:"single", required:true,
          label:"จะแนะนำบริการนี้ให้คนรู้จักหรือไม่",
          options:["แนะนำแน่นอน","น่าจะแนะนำ","ไม่แน่ใจ","ไม่แนะนำ"] }
      ]
    }
  ]
};
</script>

<style>
  :root{
    --ink:#12313A; --accent:#DFA23C; --jade:#1E6E68; --paper:#EFF3F2;
    --surface:#FFFFFF;
    --line:#D3DCDA;
    --muted:#63797E;
    --danger:#B23A2E;
    --r:14px;
    --tap:56px;                       /* ปุ่มขั้นต่ำ 56px นิ้วโป้งกดถึงแน่ */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Sarabun",-apple-system,"Segoe UI",sans-serif;
    font-size:18px; line-height:1.65;
    color:var(--ink); background:var(--paper);
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,.brand,.num{font-family:"Bai Jamjuree","Sarabun",sans-serif}

  /* หัวเรื่อง */
  header{
    background:var(--ink); color:#fff;
    padding:26px 20px 22px; position:relative;
  }
  .home-link{display:inline-block;color:rgba(255,255,255,.75);text-decoration:none;
    font-size:13px;margin-bottom:10px}
  .home-link:hover{color:#fff}
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:4px;
    background:linear-gradient(90deg,var(--accent) 0 30%,var(--jade) 30% 100%);
  }
  .brand{font-size:14px; letter-spacing:.08em; text-transform:uppercase;
         color:var(--accent); font-weight:600; margin-bottom:6px}
  header h1{font-size:24px; font-weight:700; line-height:1.35}
  header p{font-size:15px; color:#B7CBCF; margin-top:6px}
  header img{height:40px; margin-bottom:12px; display:block}

  /* แถบความคืบหน้า */
  .bar{position:sticky; top:0; z-index:20; height:6px; background:#DCE4E2}
  .bar i{display:block; height:100%; width:0; background:var(--accent);
         transition:width .35s cubic-bezier(.4,0,.2,1)}

  main{max-width:640px; margin:0 auto; padding:20px 16px 140px}

  /* หมวด */
  .sec{margin-bottom:32px}
  .sec-head{display:flex; gap:12px; align-items:baseline; margin:0 4px 14px}
  .num{font-size:13px; font-weight:700; color:var(--accent);
       border:1.5px solid var(--accent); border-radius:20px;
       padding:2px 10px; flex:none}
  .sec-head h2{font-size:19px; font-weight:600}
  .sec-head p{font-size:14px; color:var(--muted); line-height:1.5; margin-top:2px}

  /* การ์ดคำถาม */
  .q{background:var(--surface); border:1px solid var(--line);
     box-shadow:0 1px 2px rgba(18,49,58,.04),0 8px 20px -18px rgba(18,49,58,.18);
     border-radius:var(--r); padding:20px 18px; margin-bottom:14px}
  .q.err{border-color:var(--danger); box-shadow:0 0 0 3px rgba(178,58,46,.09)}
  .q-label{font-size:18px; font-weight:600; line-height:1.5; margin-bottom:4px}
  .q-label b{color:var(--danger); font-weight:600; margin-left:3px}
  .q-help{font-size:14px; color:var(--muted); margin-bottom:14px; line-height:1.5}
  .q-label + .opts, .q-label + .scale, .q-label + input,
  .q-label + textarea, .q-label + select{margin-top:14px}
  .msg{display:none; font-size:14px; color:var(--danger);
       font-weight:600; margin-top:12px}
  .q.err .msg{display:block}

  /* ตัวเลือก */
  .opts{display:flex; flex-direction:column; gap:10px}
  .opt{display:flex; align-items:center; gap:13px;
       min-height:var(--tap); padding:10px 16px;
       border:1.5px solid var(--line); border-radius:10px;
       background:var(--surface); cursor:pointer;
       font-size:17px; line-height:1.4;
       transition:border-color .15s, background .15s}
  .opt:hover{border-color:var(--jade)}
  .opt input{position:absolute; opacity:0; width:1px; height:1px}
  .box{width:24px; height:24px; flex:none; border:2px solid var(--line);
       background:#fff; transition:all .15s;
       display:grid; place-items:center}
  .opt.radio .box{border-radius:50%}
  .opt.check .box{border-radius:6px}
  .box::after{content:""; opacity:0; transition:opacity .12s}
  .opt.radio .box::after{width:11px;height:11px;border-radius:50%;background:#fff}
  .opt.check .box::after{
    width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
    transform:rotate(-45deg) translate(1px,-1px)}
  .opt.on{border-color:var(--jade); background:#EEF5F4}
  .opt.on .box{border-color:var(--jade); background:var(--jade)}
  .opt.on .box::after{opacity:1}
  .opt:focus-within{outline:3px solid var(--jade); outline-offset:2px}

  /* ★ ตัวชูโรง: แถบคะแนนแบบไล่เติม */
  .scale{display:flex; gap:6px}
  .scale button{
    flex:1; min-height:var(--tap); border-radius:8px;
    border:1.5px solid var(--line); background:var(--surface);
    font-family:"Bai Jamjuree",sans-serif; font-size:20px; font-weight:600;
    color:var(--muted); cursor:pointer;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:8px;
    position:relative; overflow:hidden;
    transition:color .18s, border-color .18s}
  .scale button::before{
    content:""; position:absolute; left:0; right:0; bottom:0;
    height:var(--h,0%); background:var(--accent);
    transition:height .25s cubic-bezier(.34,1.3,.64,1); z-index:-1}
  .scale button span{position:relative}
  .scale button.fill{color:var(--ink); border-color:var(--accent)}
  .scale button.fill::before{z-index:0}
  .scale button.fill span{z-index:1}
  .scale button:focus-visible{outline:3px solid var(--jade); outline-offset:2px}
  .ends{display:flex; justify-content:space-between;
        font-size:13px; color:var(--muted); margin-top:8px}

  /* ช่องกรอก */
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%; min-height:var(--tap); padding:12px 14px;
    font-family:inherit; font-size:17px; color:var(--ink);
    border:1.5px solid var(--line); border-radius:10px;
    background:var(--surface)}
  textarea{min-height:110px; resize:vertical; line-height:1.6}
  input:focus,textarea:focus,select:focus{
    outline:none; border-color:var(--jade); box-shadow:0 0 0 3px rgba(30,110,104,.13)}
  .count{font-size:13px; color:var(--muted); text-align:right; margin-top:6px}

  /* แถบส่ง */
  .foot{position:fixed; left:0; right:0; bottom:0; z-index:30;
        background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
        border-top:1px solid var(--line);
        padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  .foot-in{max-width:640px; margin:0 auto}
  #send{width:100%; min-height:60px; border:none; border-radius:12px;
        background:var(--ink); color:#fff; cursor:pointer;
        font-family:"Bai Jamjuree",sans-serif; font-size:19px; font-weight:600}
  #send:disabled{opacity:.5; cursor:not-allowed}
  #send:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
  #note{font-size:14px; text-align:center; margin-top:9px; color:var(--muted); min-height:20px}
  #note.bad{color:var(--danger); font-weight:600}

  /* หน้าขอบคุณ */
  #done{display:none; min-height:100svh; place-items:center; padding:40px 20px; text-align:center}
  #done.show{display:grid}
  .tick{width:76px; height:76px; border-radius:50%; background:var(--jade);
        display:grid; place-items:center; margin:0 auto 22px}
  .tick::after{content:""; width:26px; height:14px;
        border-left:4px solid #fff; border-bottom:4px solid #fff;
        transform:rotate(-45deg) translate(2px,-3px)}
  #done h2{font-size:26px; margin-bottom:10px}
  #done p{color:var(--muted); max-width:380px; margin:0 auto; line-height:1.7}

  .hidden{display:none !important}
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>

<div id="app">
  <div class="bar"><i id="prog"></i></div>
  <header>
    <a class="home-link" href="../index.html">← หน้าแรก</a>
    <img id="logo" class="hidden" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
    <div class="brand" id="org"></div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </header>
  <main id="form"></main>
  <div class="foot"><div class="foot-in">
    <button id="send">ส่งแบบสอบถาม</button>
    <div id="note"></div>
  </div></div>
</div>

<section id="done">
  <div>
    <div class="tick"></div>
    <h2 id="d-title"></h2>
    <p id="d-body"></p>
  </div>
</section>

<script>
(function(){
  "use strict";
  const C = CONFIG;
  const answers = {};                         // { qid: value }
  const nodes   = {};                         // { qid: element }
  const all     = C.sections.flatMap(s => s.questions);
  const $ = id => document.getElementById(id);

  /* ---- ธีม ---- */
  if (C.theme) for (const [k,v] of Object.entries(C.theme))
    document.documentElement.style.setProperty("--"+k, v);

  /* ---- หัวเรื่อง ---- */
  document.title  = C.title;
  $("org").textContent      = C.org;
  $("title").textContent    = C.title;
  $("subtitle").textContent = C.subtitle || "";
  if (C.logo){ const l=$("logo"); l.src=C.logo; l.alt=C.org; l.classList.remove("hidden"); }
  $("d-title").textContent = C.thanks.title;
  $("d-body").textContent  = C.thanks.body;

  const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  /* ---- สร้างฟอร์ม ---- */
  const form = $("form");
  C.sections.forEach((sec, si) => {
    const el = document.createElement("section");
    el.className = "sec";
    el.innerHTML =
      '<div class="sec-head"><span class="num">' + (si+1) + '</span><div>' +
      '<h2>' + esc(sec.title) + '</h2>' +
      (sec.desc ? '<p>' + esc(sec.desc) + '</p>' : '') + '</div></div>';
    sec.questions.forEach(q => el.appendChild(card(q)));
    form.appendChild(el);
  });

  function card(q){
    const c = document.createElement("div");
    c.className = "q";
    c.id = "q_" + q.id;
    nodes[q.id] = c;
    c.innerHTML =
      '<div class="q-label">' + esc(q.label) +
        (q.required ? '<b aria-label="จำเป็นต้องตอบ">*</b>' : '') + '</div>' +
      (q.help ? '<div class="q-help">' + esc(q.help) + '</div>' : '');
    c.appendChild(control(q));
    const m = document.createElement("div");
    m.className = "msg";
    m.textContent = "กรุณาตอบข้อนี้";
    c.appendChild(m);
    return c;
  }

  function control(q){
    /* แถบคะแนน */
    if (q.type === "scale"){
      const w = document.createElement("div");
      const row = document.createElement("div");
      row.className = "scale";
      row.setAttribute("role","radiogroup");
      row.setAttribute("aria-label", q.label);
      const n = q.points || 5;
      for (let i=1; i<=n; i++){
        const b = document.createElement("button");
        b.type = "button";
        b.innerHTML = "<span>" + i + "</span>";
        b.setAttribute("role","radio");
        b.setAttribute("aria-checked","false");
        b.setAttribute("aria-label", i + " จาก " + n);
        b.style.setProperty("--h", Math.round(30 + (i/n)*70) + "%");
        b.onclick = () => {
          answers[q.id] = i;
          [...row.children].forEach((x,k) => {
            const on = k < i;
            x.classList.toggle("fill", on);
            x.setAttribute("aria-checked", k === i-1 ? "true" : "false");
          });
          ok(q.id); tick();
        };
        row.appendChild(b);
      }
      w.appendChild(row);
      if (q.lowLabel || q.highLabel){
        const e = document.createElement("div");
        e.className = "ends";
        e.innerHTML = '<span>' + esc(q.lowLabel||"") + '</span><span>' +
                      esc(q.highLabel||"") + '</span>';
        w.appendChild(e);
      }
      return w;
    }

    /* เลือกหนึ่ง / เลือกหลาย */
    if (q.type === "single" || q.type === "multi"){
      const multi = q.type === "multi";
      const w = document.createElement("div");
      w.className = "opts";
      w.setAttribute("role", multi ? "group" : "radiogroup");
      w.setAttribute("aria-label", q.label);
      q.options.forEach((o,i) => {
        const lab = document.createElement("label");
        lab.className = "opt " + (multi ? "check" : "radio");
        lab.innerHTML =
          '<input type="' + (multi?"checkbox":"radio") + '" name="' + q.id + '" ' +
          'value="' + esc(o) + '"><span class="box"></span><span>' + esc(o) + '</span>';
        const inp = lab.querySelector("input");
        inp.onchange = () => {
          if (multi){
            const on = [...w.querySelectorAll("input:checked")].map(x => x.value);
            if (q.max && on.length > q.max){ inp.checked = false; return; }
            answers[q.id] = on;
            lab.classList.toggle("on", inp.checked);
          } else {
            answers[q.id] = inp.value;
            [...w.children].forEach(x => x.classList.remove("on"));
            lab.classList.add("on");
          }
          ok(q.id); refresh(); tick();
        };
        w.appendChild(lab);
      });
      return w;
    }

    /* เมนูเลื่อน */
    if (q.type === "dropdown"){
      const s = document.createElement("select");
      s.setAttribute("aria-label", q.label);
      s.innerHTML = '<option value="">— เลือก —</option>' +
        q.options.map(o => '<option value="' + esc(o) + '">' + esc(o) + '</option>').join("");
      s.onchange = () => { answers[q.id] = s.value; ok(q.id); refresh(); tick(); };
      return s;
    }

    /* ข้อความยาว */
    if (q.type === "longtext"){
      const w = document.createElement("div");
      const t = document.createElement("textarea");
      t.maxLength = q.maxLength || 500;
      t.placeholder = q.placeholder || "";
      t.setAttribute("aria-label", q.label);
      const cnt = document.createElement("div");
      cnt.className = "count";
      cnt.textContent = "0 / " + t.maxLength;
      t.oninput = () => {
        answers[q.id] = t.value.trim();
        cnt.textContent = t.value.length + " / " + t.maxLength;
        ok(q.id); tick();
      };
      w.appendChild(t); w.appendChild(cnt);
      return w;
    }

    /* ข้อความสั้น / ตัวเลข / วันที่ */
    const i = document.createElement("input");
    i.type = q.type === "number" ? "number" : q.type === "date" ? "date" : "text";
    if (q.min != null) i.min = q.min;
    if (q.max != null) i.max = q.max;
    if (q.maxLength) i.maxLength = q.maxLength;
    i.placeholder = q.placeholder || "";
    i.setAttribute("aria-label", q.label);
    i.oninput = () => { answers[q.id] = i.value.trim(); ok(q.id); tick(); };
    return i;
  }

  /* ---- เงื่อนไขข้ามข้อ ---- */
  const visible = q => {
    if (!q.showIf) return true;
    const v = answers[q.showIf.id];
    const list = Array.isArray(v) ? v : [v];
    return (q.showIf.anyOf || []).some(x => list.includes(x));
  };

  function refresh(){
    all.forEach(q => {
      const on = visible(q);
      nodes[q.id].classList.toggle("hidden", !on);
      if (!on) delete answers[q.id];       // ซ่อนแล้วต้องล้างคำตอบ ไม่งั้นข้อมูลเพี้ยน
    });
  }

  const answered = q => {
    const v = answers[q.id];
    return Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== "" && v !== null);
  };

  function tick(){
    const need = all.filter(q => q.required && visible(q));
    const got  = need.filter(answered).length;
    $("prog").style.width = (need.length ? got/need.length*100 : 0) + "%";
  }

  const ok = id => nodes[id].classList.remove("err");

  /* ---- ส่ง ---- */
  if (C.demoMode){
    const b = document.createElement("div");
    b.textContent = "โหมดตัวอย่าง · กรอกทดสอบได้ตามสบาย ข้อมูลไม่ถูกบันทึกที่ไหน";
    b.style.cssText = "background:#DFA23C;color:#2A1E08;text-align:center;font-weight:600;" +
                      "font-size:14.5px;padding:9px 14px;line-height:1.45";
    document.body.insertBefore(b, document.body.firstChild);
  }

  const seen = "sent_" + C.formId;
  if (C.submitOnce && !C.demoMode){
    try { if (localStorage.getItem(seen)) finish(); } catch(e){}
  }

  function finish(){
    $("app").style.display = "none";
    $("done").classList.add("show");
    window.scrollTo(0,0);
  }

  $("send").onclick = async () => {
    const bad = all.filter(q => q.required && visible(q) && !answered(q));
    if (bad.length){
      bad.forEach(q => nodes[q.id].classList.add("err"));
      const note = $("note");
      note.className = "bad";
      note.textContent = "ยังไม่ได้ตอบ " + bad.length + " ข้อ";
      nodes[bad[0].id].scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }

    const btn  = $("send");
    const note = $("note");
    btn.disabled = true;
    btn.textContent = "กำลังส่ง…";
    note.className = "";
    note.textContent = "";

    const flat = {};
    all.forEach(q => {
      if (!visible(q)) { flat[q.id] = ""; return; }
      const v = answers[q.id];
      flat[q.id] = Array.isArray(v) ? v.join(" | ") : (v ?? "");
    });

    if (C.demoMode){
      await new Promise(r => setTimeout(r, 600));
      finish();
      return;
    }

    try {
      const r = await fetch(C.endpoint, {
        method: "POST",
        // text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ตอบไม่ได้
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ token: C.token, formId: C.formId, answers: flat })
      });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error || "ส่งไม่สำเร็จ");
      try { if (C.submitOnce) localStorage.setItem(seen, "1"); } catch(e){}
      finish();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "ลองส่งอีกครั้ง";
      note.className = "bad";
      note.textContent = "ส่งไม่สำเร็จ ตรวจสัญญาณอินเทอร์เน็ตแล้วกดส่งใหม่";
    }
  };

  refresh(); tick();
})();
</script>
</body>
</html>
